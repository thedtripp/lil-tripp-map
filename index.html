const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const map=L.map('map').setView([37.79,-122.40],14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map);
function popup(p){
 let h='<div class="iw"><b>'+esc(p.name)+'</b><div>'+esc(p.address)+'</div>';
 if(safe(p.website))h+='<div><a href="'+esc(p.website)+'" target="_blank" rel="noopener">Website</a></div>';
 if(safe(p.careers))h+='<div><a href="'+esc(p.careers)+'" target="_blank" rel="noopener">Careers</a></div>';
 return h+'</div>';
}
function render(){
 const q=$('q').value.toLowerCase(),c=$('careers').checked;
 const rows=D.filter(p=>(!q||(p.name+' '+p.address).toLowerCase().includes(q))&&(!c||safe(p.careers)));
 layer.clearLayers();$('list').innerHTML='';
 $('count').textContent=rows.length+' of '+D.length+' companies';
 rows.forEach(p=>{
  const m=L.marker([p.lat,p.lng]).bindPopup(popup(p)).addTo(layer);
  const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+esc(p.name)+'</b><span>'+esc(p.address)+'</span>';
  d.onclick=()=>{map.setView([p.lat,p.lng],17);m.openPopup()};
  $('list').appendChild(d);
 });
}
['q','careers'].forEach(id=>$(id).addEventListener('input',render));render();
</script></body></html>
